name: PyPI

# Platform wheels (win_amd64 / manylinux) with bundled shared kit.
# Tag push v* → publish PyPI; workflow_dispatch → optional TestPyPI.

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [master]
    paths:
      - "python/**"
      - "pyproject.toml"
      - "setup.py"
      - "scripts/build_pypi_wheel.py"
      - "scripts/package_release_libs.py"
      - "src/**"
      - "CMakeLists.txt"
  workflow_dispatch:
    inputs:
      publish:
        description: Upload target
        type: choice
        options:
          - none
          - testpypi
          - pypi

concurrency:
  group: pypi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.3"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            qt_host: windows
            qt_arch: win64_msvc2022_64
          - os: ubuntu-22.04
            qt_host: linux
            qt_arch: linux_gcc_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-cursor0 libxcb-cursor-dev libxcb-xinerama0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-randr0

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtmultimedia qtimageformats
          cache: true
          install-deps: ${{ runner.os == 'Linux' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build shared kit + wheel
        shell: bash
        run: python scripts/build_pypi_wheel.py --keep-staged

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/qwinui3-*.whl
          if-no-files-found: error

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upload to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          python -m twine upload --non-interactive dist/qwinui3-*.whl

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          python -m twine upload --non-interactive dist/qwinui3-*.whl
