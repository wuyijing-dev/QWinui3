name: Release

# Build Linux (and Windows) release packages and attach them to a GitHub Release.
# Triggers:
#   - push of version tags: v1.00, v1.01, v1.10, …
#   - manual workflow_dispatch (builds artifacts; uploads to a release when tag/version given)
#
# Product version format is X.YY (two-digit minor). See ROADMAP.md / QWINUI3_VERSION.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version as X.YY without leading v (e.g. 1.01). Empty = QWINUI3_VERSION from CMake."
        required: false
        default: ""
      modules:
        description: "Library modules to package (all | core | shell | theme,style,platform,extras)"
        required: false
        default: "all"
      publish:
        description: "Upload / create GitHub Release for this version"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_VERSION: "6.8.3"

jobs:
  resolve-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      should_publish: ${{ steps.v.outputs.should_publish }}
      modules: ${{ steps.v.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          MODULES="all"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            PUBLISH=true
            MODULES="all"
          else
            VERSION="${{ inputs.version }}"
            MODULES="${{ inputs.modules }}"
            if [[ -z "${MODULES}" ]]; then
              MODULES="all"
            fi
            if [[ -z "${VERSION}" ]]; then
              VERSION="$(python -c "import re; from pathlib import Path; t=Path('CMakeLists.txt').read_text(encoding='utf-8'); m=re.search(r'set\\s*\\(\\s*QWINUI3_VERSION\\s+\\\"([0-9]+\\.[0-9]{2})\\\"\\s*\\)', t); print(m.group(1) if m else '')")"
            fi
            TAG="v${VERSION}"
            PUBLISH="${{ inputs.publish }}"
          fi
          if [[ -z "${VERSION}" ]]; then
            echo "Could not resolve version" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "should_publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "modules=${MODULES}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${TAG} modules=${MODULES} (publish=${PUBLISH})"

  linux:
    needs: resolve-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-cursor0 libxcb-cursor-dev libxcb-xinerama0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-randr0 \
            libfuse2 desktop-file-utils

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtquickeffects qtmultimedia qtimageformats qtsvg
          cache: true
          install-deps: true

      - name: Package shared libraries
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          MODULES: ${{ needs.resolve-version.outputs.modules }}
        run: |
          set -euo pipefail
          EXTRA=()
          case "${MODULES}" in
            all|full) EXTRA+=(--preset all) ;;
            core|shell|theme|style|platform|extras) EXTRA+=(--preset "${MODULES}") ;;
            *) EXTRA+=(--modules "${MODULES}") ;;
          esac
          python scripts/package_release_libs.py --shared --archive --version "$VERSION" "${EXTRA[@]}"

      - name: Package Gallery
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          python scripts/package_release_gallery.py --version "$VERSION" --out dist

      - name: List artifacts
        run: ls -lh dist/*

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/qwinui3-*-linux-x64-shared*.tar.gz
            dist/qwinui3-gallery-*-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    needs: resolve-version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: choco install ninja -y

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtquickeffects qtmultimedia qtimageformats qtsvg
          cache: true

      - name: Package shared libraries
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          MODULES: ${{ needs.resolve-version.outputs.modules }}
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          case "${MODULES}" in
            all|full) EXTRA+=(--preset all) ;;
            core|shell|theme|style|platform|extras) EXTRA+=(--preset "${MODULES}") ;;
            *) EXTRA+=(--modules "${MODULES}") ;;
          esac
          python scripts/package_release_libs.py --shared --archive --version "$VERSION" "${EXTRA[@]}"

      - name: Package Gallery
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        shell: bash
        run: |
          python scripts/package_release_gallery.py --version "$VERSION" --out dist

      - name: List artifacts
        shell: bash
        run: ls -lh dist/*

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/qwinui3-*-windows-x64-shared*.zip
            dist/qwinui3-gallery-*-windows-x64.zip
          if-no-files-found: error

  publish:
    needs: [resolve-version, linux, windows]
    if: needs.resolve-version.outputs.should_publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        id: files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp -v {} release-assets/ \;
          ls -lh release-assets/
          {
            echo "files<<EOF"
            find release-assets -type f | sort
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="$(cat <<EOF
          ## QWinUI3 ${VERSION}

          Automated CI release packages (Qt ${{ env.QT_VERSION }}).

          ### Downloads

          | Asset | Platform | Contents |
          |-------|----------|----------|
          | \`qwinui3-${VERSION}-linux-x64-shared.tar.gz\` | Linux x64 | Shared \`.so\` + QML modules |
          | \`qwinui3-gallery-${VERSION}-linux-x64.tar.gz\` | Linux x64 | Gallery AppDir + Qt runtime |
          | \`qwinui3-${VERSION}-windows-x64-shared.zip\` | Windows x64 | Shared DLLs + QML modules |
          | \`qwinui3-gallery-${VERSION}-windows-x64.zip\` | Windows x64 | Gallery + Qt runtime (windeployqt) |

          ### Docs

          - https://wuyijing-dev.github.io/QWinui3/
          - License: MIT (Theme/Style/Platform) + GPL-3.0 (Extras) — see LICENSE / LICENSE-MIT / LICENSE-GPL in repo
          EOF
          )"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release $TAG"
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --notes "$NOTES" || true
          else
            echo "Creating release $TAG"
            # Tag may already exist (tag push) or not (workflow_dispatch).
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" release-assets/* --title "QWinUI3 ${VERSION}" --notes "$NOTES"
            else
              gh release create "$TAG" release-assets/* --title "QWinUI3 ${VERSION}" --notes "$NOTES" --target "${GITHUB_SHA}"
            fi
          fi
          echo "Published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
