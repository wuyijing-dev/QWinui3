site_name: QWinUI3
site_description: Fluent / WinUI 3 controls for Qt 6.5+ (recommended 6.8+)
site_url: https://wuyijing-dev.github.io/QWinui3/
repo_url: https://github.com/wuyijing-dev/QWinui3
repo_name: wuyijing-dev/QWinui3
edit_uri: edit/master/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: ignore
  anchors: warn

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wuyijing-dev/QWinui3

nav:
  - Home: index.md
  - Recipes:
    - Overview: recipes.md
    - Getting started:
      - Qt Creator: qt-creator.md
      - Consumer packaging: packaging-consumer.md
      - Qt version compat: qt-version-compat.md
      - Conventions: conventions.md
    - App shells:
      - Window shells: window-shells.md
      - Window chrome: window-chrome.md
      - WindowHelper: window-helper.md
      - AppWindow: window-appwindow.md
      - Linux / Wayland: platform-linux-wayland.md
      - Graphics backend: graphics-backend.md
      - Transparency / DWM: window-transparency-dwm.md
    - Navigation & data:
      - Navigation & TabView: navigation.md
      - Forms & settings: forms.md
      - Data collections: data-collections.md
      - Tree & hierarchical: tree-data.md
      - Input & pickers: pickers.md
      - Density & responsive: density.md
      - Touch, pen & pointer: touch-pointer.md
      - Adaptive layout: adaptive-layout.md
      - Theme overrides: theme-overrides.md
      - Color & contrast: color-contrast.md
      - Icons & FluentIcons: icons.md
      - i18n / RTL: i18n-rtl.md
    - Feedback & commands:
      - Feedback surfaces: feedback.md
      - Dialogs & flyouts: dialogs-flyouts.md
      - Commands & menus: commands.md
      - Keyboard-first: keyboard.md
      - Accessibility: accessibility.md
    - Platform & media:
      - System integration: system-integration.md
      - Drag-drop & clipboard: drag-drop.md
      - Shell extras: shell-extras.md
      - WebView2: webview2.md
      - Media: media.md
      - Charts & gauges: charts.md
      - Animations: animations.md
      - Performance: performance.md
    - Quality:
      - CI smoke: ci-smoke.md
      - Gallery CatalogPage: gallery-catalog-page.md
      - 1.xx compatibility: compatibility-1xx.md
      - 1.xx maturity checkpoint: maturity-1xx.md
      - Upgrade notes: upgrade-notes.md
  - Stable API: stable-api.md
  - Component API: components.md
  - Roadmap: roadmap.md
  - Legacy redirects:
    - WebView2 (old link): webview2-future.md
