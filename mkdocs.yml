site_name: QWinUI3
site_description: Fluent / WinUI 3 controls for Qt 6.5+ (recommended 6.8+)
site_url: https://wuyijing-dev.github.io/QWinui3/
repo_url: https://github.com/wuyijing-dev/QWinui3
repo_name: wuyijing-dev/QWinui3
edit_uri: edit/master/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: ignore
  anchors: warn

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wuyijing-dev/QWinui3

nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Stable API: stable-api.md
  - Accessibility: accessibility.md
  - Component API: components.md
  - Conventions: conventions.md
  - Gallery CatalogPage: gallery-catalog-page.md
  - Graphics backend: graphics-backend.md
  - WebView2: webview2.md
  - CI smoke: ci-smoke.md
  - Data collections: data-collections.md
  - Tree & hierarchical data: tree-data.md
  - Performance: performance.md
  - Navigation & TabView: navigation.md
  - Input & pickers: pickers.md
  - Icons & FluentIcons: icons.md
  - Density & responsive: density.md
  - Forms & settings: forms.md
  - Theme overrides: theme-overrides.md
  - System integration: system-integration.md
  - Shell extras: shell-extras.md
  - Charts & gauges: charts.md
  - Media: media.md
  - Consumer packaging: packaging-consumer.md
  - i18n / RTL: i18n-rtl.md
  - Commands & menus: commands.md
  - Dialogs & flyouts: dialogs-flyouts.md
  - Animations & transitions: animations.md
  - WebView2 (legacy link): webview2-future.md
  - Linux / Wayland: platform-linux-wayland.md
  - Window shells: window-shells.md
